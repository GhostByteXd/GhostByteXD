
name: Generate Ghost Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Ghost Snake
        uses: Platane/snk@v3
        with:
          github_user_name: GhostByteXD
          outputs: |
            dist/github-snake.svg?color_snake=%23b8f3ff&color_dots=%230b1b36,%23123b68,%231766a8,%23269de0,%238be9ff
            dist/github-snake-dark.svg?color_snake=%23b8f3ff&color_dots=%230b1b36,%23123b68,%231766a8,%23269de0,%238be9ff

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
