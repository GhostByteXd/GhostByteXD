
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: GhostByteXD
          outputs: |
            dist/github-snake.svg?color_snake=%2300F7FF&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300F7FF

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
